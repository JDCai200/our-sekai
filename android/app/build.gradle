plugins { id 'com.android.application'; id 'com.chaquo.python' }

android {
    namespace 'org.oursekai.companion'
    compileSdk 35
    defaultConfig {
        applicationId 'org.oursekai.companion'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

chaquopy {
    defaultConfig {
        version '3.10'
        buildPython System.getenv('OURSEKAI_BUILD_PYTHON')
        pip { install 'numpy==1.23.3'; install 'scipy==1.8.1'; install 'soxr==0.3.6' }
    }
}

dependencies { implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0' }
